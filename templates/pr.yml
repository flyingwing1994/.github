# Sjabloon: kopieer naar .github/workflows/pr.yml in een repo en vul de commando's in.
# Uitleg en alle invoervelden: https://github.com/flyingwing1994/.github/blob/main/CHECKS.md
name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    uses: flyingwing1994/.github/.github/workflows/checks.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      # Leeg laten wat niet van toepassing is.
      node-version: ""
      python-version: ""
      install: ""          # bijv. npm ci
      lint: ""             # bijv. npm run lint
      build: ""            # bijv. npm run build
      test: ""             # bijv. npm test
      tests-verplicht: false   # true zodra het testbasis-issue klaar is

  # Eigen checks van deze repo (optioneel), bijv.:
  # ha-config:
  #   runs-on: ubuntu-latest
  #   steps: ...

  review:
    needs: [checks]        # + eventuele eigen checks: review pas als alles groen is
    uses: flyingwing1994/.github/.github/workflows/review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      tests-verplicht: false   # gelijk houden aan checks
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  automerge:
    needs: [checks, review]   # + eventuele eigen checks
    uses: flyingwing1994/.github/.github/workflows/automerge.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write

  bord:
    # Na de review: zet gekoppelde issues op In review als de checks of de review `risico` zetten.
    needs: [review]
    if: ${{ !cancelled() }}
    uses: flyingwing1994/.github/.github/workflows/bord.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      project: 1   # nummer van het bord
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
