# PR-checks voor de .github-repo zelf. Gebruikt de workflows uit deze PR (lokale verwijzing),
# zodat een wijziging aan de centrale checks zichzelf test. Andere repo's: zie templates/pr.yml.
name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      central-ref: ${{ github.event.pull_request.head.sha }}
      test: python3 -m unittest discover -s ci -v
      tests-verplicht: true

  automerge:
    needs: [checks]
    uses: ./.github/workflows/automerge.yml
    permissions:
      contents: write
      pull-requests: write
